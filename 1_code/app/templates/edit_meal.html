{% extends "base.html" %}
{% block title %}Edit Meal | CaloFit{% endblock %}

{% block content %}
<div class="cf-page-header">
  <div>
    <h1>Edit Meal ✏️</h1>
    <p>Update the meal information below.</p>
  </div>
  <a href="/meals/{{ meal['meal_id'] }}" class="btn-cf-ghost">← Cancel</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="cf-card p-4">
      <form id="edit-meal-form" action="/meals/{{ meal['meal_id'] }}/edit">

        <div class="mb-3">
          <label class="cf-label">Food Name <span style="color:#e74c3c;">*</span></label>
          <div class="input-group">
            <input type="text" class="form-control" id="food_name" name="food_name"
                   value="{{ meal['food_name'] }}" required>
            <button type="button" class="btn btn-outline-secondary" id="nutrition-lookup-btn">🔍 Lookup</button>
          </div>
          <div id="nutrition-feedback" class="small mt-1"></div>
          <div id="nutrition-results" class="mt-2"></div>
        </div>

        <div class="mb-3">
          <label class="cf-label">Meal Type <span style="color:#e74c3c;">*</span></label>
          <select class="form-select" id="meal_type" name="meal_type" required>
            {% for t, icon in [('Breakfast','☀️'),('Lunch','🥗'),('Dinner','🍽️'),('Snack','🍎')] %}
            <option value="{{ t }}" {% if meal['meal_type'] == t %}selected{% endif %}>{{ icon }} {{ t }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="cf-label">Date <span style="color:#e74c3c;">*</span></label>
          <input type="date" class="form-control" id="log_date" name="log_date"
                 value="{{ meal['log_date'] }}" required>
        </div>

        <div class="mb-3">
          <label class="cf-label">Calories (kcal) <span style="color:#e74c3c;">*</span></label>
          <input type="number" class="form-control" id="calories" name="calories"
                 min="0" value="{{ meal['calories'] }}" required>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="cf-label">Protein (g)</label>
            <input type="number" step="0.1" class="form-control" id="protein" name="protein"
                   min="0" value="{{ meal['protein'] }}">
          </div>
          <div class="col-md-4 mb-3">
            <label class="cf-label">Carbs (g)</label>
            <input type="number" step="0.1" class="form-control" id="carbs" name="carbs"
                   min="0" value="{{ meal['carbs'] }}">
          </div>
          <div class="col-md-4 mb-3">
            <label class="cf-label">Fats (g)</label>
            <input type="number" step="0.1" class="form-control" id="fats" name="fats"
                   min="0" value="{{ meal['fats'] }}">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-2">
          <button type="submit" class="btn-cf-primary" style="padding:0.55rem 1.5rem;">Save Changes ✓</button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
