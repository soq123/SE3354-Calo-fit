{% extends "base.html" %}
{% block title %}Register | CaloFit{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">CaloFit 🌿</div>
    <p class="auth-sub">Create your account and start tracking today!</p>

    <form action="/register" method="POST" novalidate>
      <div class="mb-3">
        <label class="cf-label" for="username">Username <span style="color:#e74c3c;">*</span></label>
        <input type="text" class="form-control" id="username" name="username"
               autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="cf-label" for="email">Email <span style="color:#e74c3c;">*</span></label>
        <input type="email" class="form-control" id="email" name="email"
               autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="cf-label" for="password">Password <span style="color:#e74c3c;">*</span></label>
        <input type="password" class="form-control" id="password" name="password"
               autocomplete="new-password" required minlength="8"
               oninput="checkStrength(this.value)">
        <div id="strength-bar" class="progress mt-1" style="height:4px;display:none">
          <div id="strength-fill" class="progress-bar" style="width:0%"></div>
        </div>
        <div id="strength-label" class="small mt-1" style="color:var(--text-muted);"></div>
      </div>
      <div class="mb-3">
        <label class="cf-label" for="confirm_password">Confirm Password <span style="color:#e74c3c;">*</span></label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
               autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label class="cf-label" for="calorie_goal">Daily Calorie Goal</label>
        <input type="number" class="form-control" id="calorie_goal" name="calorie_goal"
               min="1000" step="50" value="2000">
        <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.3rem;">Default is 2000 kcal. You can adjust this later.</div>
      </div>
      <button type="submit" class="btn-cf-primary w-100" style="border-radius:12px;padding:0.65rem;font-size:1rem;">Create Account 🌿</button>
    </form>

    <hr style="margin:1.5rem 0;border-color:#e8e0d0;">
    <p style="text-align:center;font-size:0.88rem;color:var(--text-muted);margin:0;">
      Already have an account? <a href="/login" style="color:var(--green-dark);font-weight:700;">Log in</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function checkStrength(pw) {
  const bar = document.getElementById("strength-bar");
  const fill = document.getElementById("strength-fill");
  const label = document.getElementById("strength-label");
  bar.style.display = pw.length ? "flex" : "none";
  let score = 0;
  if (pw.length >= 8)  score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { pct: 20, cls: "bg-danger",  text: "Very weak" },
    { pct: 40, cls: "bg-danger",  text: "Weak" },
    { pct: 60, cls: "bg-warning", text: "Fair" },
    { pct: 80, cls: "bg-info",    text: "Good" },
    { pct: 100, cls: "bg-success", text: "Strong" },
  ];
  const lvl = levels[Math.min(score, 4)];
  fill.style.width = lvl.pct + "%";
  fill.className = "progress-bar " + lvl.cls;
  label.textContent = lvl.text;
}
</script>
{% endblock %}
