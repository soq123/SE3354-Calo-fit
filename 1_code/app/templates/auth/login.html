{% extends "base.html" %}
{% block title %}Login | CaloFit{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">CaloFit 🌿</div>
    <p class="auth-sub">Welcome back! Log in to your account.</p>

    <form action="/login" method="POST" novalidate>
      <div class="mb-3">
        <label class="cf-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               autocomplete="email" required autofocus>
      </div>
      <div class="mb-3">
        <label class="cf-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <div class="mb-4 d-flex justify-content-between align-items-center">
        <div class="form-check mb-0">
          <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
          <label class="form-check-label" for="remember_me" style="font-size:0.88rem;">Remember me</label>
        </div>
        <a href="/forgot-password" style="font-size:0.85rem;color:var(--green-dark);">Forgot password?</a>
      </div>
      <button type="submit" class="btn-cf-primary w-100" style="border-radius:12px;padding:0.65rem;font-size:1rem;">Log In</button>
    </form>

    <hr style="margin:1.5rem 0;border-color:#e8e0d0;">
    <p style="text-align:center;font-size:0.88rem;color:var(--text-muted);margin:0;">
      Don't have an account? <a href="/register" style="color:var(--green-dark);font-weight:700;">Register</a>
    </p>
  </div>
</div>
{% endblock %}
