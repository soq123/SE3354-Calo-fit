{% extends "base.html" %}
{% block title %}Register | CaloFit{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-70">
    <div class="col-md-9 col-lg-6">
        <div class="card calofit-card auth-card">
            <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                    <h1 class="page-title mb-2">Create your account</h1>
                    <p class="text-muted mb-0">Set up personalized calorie tracking and nutrition insights.</p>
                </div>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="username">Username</label>
                            <input class="form-control" type="text" id="username" name="username" value="{{ username or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="email">Email</label>
                            <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="password">Password</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="confirm_password">Confirm Password</label>
                            <input class="form-control" type="password" id="confirm_password" name="confirm_password" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="calorie_goal">Daily Calorie Goal</label>
                            <input class="form-control" type="number" id="calorie_goal" name="calorie_goal" min="1000" step="50" value="{{ calorie_goal or 2000 }}" required>
                        </div>
                    </div>
                    <button class="btn btn-success w-100 mt-4" type="submit">Create Account</button>
                </form>
                <p class="small text-muted mt-4 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
