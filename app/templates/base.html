<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CaloFit{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="dashboard-bg">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm calofit-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">CaloFit</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/meals/new">Add Meal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/meals/history">Meal History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/mood">Mood Tracker</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analytics/weekly">Weekly Summary</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/foods">Food Search</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="py-4">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
